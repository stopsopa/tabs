name: Pipeline

# The only workflow of this repository, one run per push:
#
#   every push to master, every PR   test (prettier, typecheck, unit tests, browser tests)
#   push to master                   ... and then: github-pages  (GitHub Pages)
#
# There is no package to release: projects copy the files of the library (see README.md),
# github pages serves them together with the demos.

on:
  push:
    branches:
      - master
  pull_request:
  # trigger only for master and PR, commits to branches will be ignored
  # if you wan't to trigger ci/cd for branch then just create PR

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-22.04 # https://github.com/actions/runner-images#available-images
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # jsdom (tests) needs 22.13+
          node-version: 24

      - name: Install dependencies
        run: npm ci

      # generated files are not in git: the site (index.html, demo/react/index.html) gets them from here
      - name: Transpile vanilla-tabs.ts -> vanilla-tabs.js, vanilla-tabs.esm.js and the demo of the React component
        run: /bin/bash transpile.sh

      - name: Prettier check (run "xx style:fix" or "npm run style:fix" locally to fix)
        run: npm run style:check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (vitest + jsdom - vanilla library, generated files, react component, SSR)
        run: npm test

      - name: Install the browser for e2e tests
        run: npx playwright install --with-deps chromium

      - name: Browser tests (playwright - mouse, keyboard and api on both demo pages)
        run: npm run e2e

      - name: Upload traces of failed browser tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

      # other projects still load the library from the old urls (https://stopsopa.github.io/tabs/vanilla-tabs.js)
      # copies in the old location print console.error telling to switch to skills/vanilla-tabs/
      - name: Recreate legacy location of the library (with deprecation warning)
        run: /bin/bash .github/legacy_location.sh

      - name: Clean before artifact
        run: /bin/bash .github/clean_before_artifact.sh

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3.0.1
        with:
          path: .

  # Deployment job
  github-pages:
    # NOTE: In case of error:
    # github-pages
    # Branch "main" is not allowed to deploy to github-pages due to environment protection rules.
    # https://github.com/orgs/community/discussions/39054#discussioncomment-6420042
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-22.04
    needs: test
    # pull requests are only tested
    if: github.event_name != 'pull_request'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4.0.5
        with:
          error_count: 3
          # https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#example-of-onworkflow_callsecrets
          # https://github.com/actions/deploy-pages#inputs-
